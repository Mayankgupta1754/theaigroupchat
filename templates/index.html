<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The AI Group Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <h1 class="brand-name">The AI Group Chat</h1>
        <p class="credit">by Mayank Gupta</p>
      </div>
      <div class="mode-toggle" role="radiogroup" aria-label="Response mode">
        <label class="mode-opt">
          <input type="radio" name="mode" value="answer" checked />
          <span>Answer</span>
        </label>
        <label class="mode-opt">
          <input type="radio" name="mode" value="solve" />
          <span>Solve</span>
        </label>
      </div>
      <p class="meta">
        <span class="models">GPT · Claude · Gemini · DeepSeek</span>
        <span id="status-chip" class="chip" data-state="ready">Ready</span>
      </p>
    </header>

    <main>
      <section id="composer">
        <form id="mcq-form">
          <div class="editor">
            <textarea
              id="question"
              spellcheck="true"
              placeholder="Paste a question — or several. You can also attach a photo."
            ></textarea>
            <div class="statusbar">
              <div class="dropzone" id="dropzone">
                <input
                  id="image-input"
                  type="file"
                  accept="image/jpeg,image/png,image/webp,image/gif"
                  hidden
                />
                <div class="dropzone-copy" id="dropzone-copy">Attach photo</div>
                <div class="preview hidden" id="image-preview">
                  <img id="preview-img" alt="Uploaded question" />
                  <span id="preview-name">Photo attached</span>
                  <button type="button" class="linkish" id="clear-image">Remove</button>
                </div>
              </div>
              <button type="button" class="secondary" id="camera-btn">Camera</button>
              <p class="hint" id="upload-hint">Images are transcribed before they go to the panel.</p>
              <button type="submit" id="ask-btn">Run panel</button>
            </div>
          </div>
        </form>
      </section>

      <section class="session hidden" id="session">
        <aside class="pane">
          <div class="pane-h question-head">
            <span>Question</span>
            <nav class="q-nav hidden" id="q-nav" aria-label="Questions"></nav>
          </div>
          <div id="question-view"></div>
          <div class="consensus-box" id="consensus-box">
            <span class="muted">Waiting</span>
          </div>
        </aside>
        <section class="pane chat-wrap">
          <div class="pane-h">Panel</div>
          <div class="chat" id="chat"></div>
        </section>
        <button type="button" class="again-inline hidden" id="again-btn">Back</button>
      </section>
    </main>

    <div class="modal hidden" id="camera-modal" role="dialog" aria-modal="true" aria-labelledby="camera-title">
      <div class="modal-card">
        <div class="modal-h">
          <h2 id="camera-title">Camera</h2>
          <button type="button" class="linkish" id="camera-cancel">Close</button>
        </div>
        <video id="camera-video" autoplay playsinline muted></video>
        <p class="hint" id="camera-hint">Hold still, then capture.</p>
        <div class="modal-actions">
          <button type="button" id="shutter-btn">Capture</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
